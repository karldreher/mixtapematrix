name: CI/CD
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # PR events check out a detached merge ref, which semantic-release
          # cannot map to a branch group. Check out the PR branch instead.
          ref: ${{ github.head_ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Run tests
        run: |
          uv run pytest -v

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Semantic release preview
        run: uv run semantic-release --noop version --print

  release:
    needs: pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Semantic Release
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          uv run semantic-release -v version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
