[project]
name = "mixtapematrix"
version = "4.0.0"
description = "Declarative MP3 File Management for passionate listeners."
authors = [{ name = "Karl Dreher" }]
requires-python = ">3.13, <3.15"
readme = "README.md"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml~=6.0.3",
    "eyed3~=0.9.9",
    "click~=8.5.0",
    "ormsgpack>=1.12.2",
]

[project.scripts]
mixtape = "mixtapematrix.main:cli"
mixtapematrix = "mixtapematrix.main:cli"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "jsonschema>=4.26.0",
]
release = ["python-semantic-release>=9.16.1,<10"]

[tool.uv]
default-groups = [
    "dev",
    "release",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["test/source", "test/output"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: pyupgrade, B: bugbear,
# SIM: simplify, BLE: blind except, TRY004: prefer TypeError for type checks
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "TRY004"]
# line length is owned by `ruff format`; long strings and comments are left alone
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-v --cov"

[tool.coverage.run]
omit = [".venv*", "test/*", "*__init__*"]

[tool.semantic_release]
version_variables = ["mixtapematrix/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
# Re-lock after the version bump so uv.lock records the new package version,
# and stage it so it lands in the release commit.
build_command = "uv lock && git add uv.lock"

[tool.semantic_release.branches.main]
match = "(main|master)"

[tool.semantic_release.branches.preview]
# this is only here to get previews of release bumps
match = ".+"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

